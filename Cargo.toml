[package]
name = "sparkfun-otos"
version = "0.1.3"
edition = "2024"
license = "LGPL-3.0-only AND MIT"
authors = ["Soupborsh"]
description = "SparkFun OTOS embedded-hal-async driver"
repository = "https://github.com/XLNC-APEX/sparkfun-otos.git"

[dependencies]
arrayref = "0.3.9"
bitfield-struct = "0.13.0"
defmt = { version = "1.1.1", optional = true }
doctest-file = "1.1.1"
embedded-hal-async = "1.0.0"
nalgebra = { version = "0.35.0", optional = true, default-features = false, features = [
    "libm",
] }

[features]
defmt = ["dep:defmt"]
nalgebra = ["dep:nalgebra"]

[dev-dependencies]
doctest-file = "1.1.1"
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh1", "embedded-hal-async"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
